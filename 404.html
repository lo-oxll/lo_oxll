<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>الصفحة غير موجودة | علي كامل ياسين</title>
  <link rel="icon" href="/lo_oxll/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/lo_oxll/styles.css">
  <script>
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); } catch (e) {}
  </script>
  <style>
    body { min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center; }
    .nf { max-width: 460px; }
    .nf__code { font-family: 'Amiri', serif; font-size: clamp(72px, 20vw, 120px); line-height: 1; font-weight: 700; color: var(--fg); }
    .nf h1 { font-size: 24px; margin: 8px 0; }
    .nf p { color: var(--fg-muted); margin-bottom: 24px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf__code">404</div>
    <h1>الصفحة غير موجودة</h1>
    <p>الرابط غير صحيح أو تم نقله. يمكنك العودة إلى السيرة الذاتية من الزر أدناه.</p>
    <a class="btn btn--primary" href="/lo_oxll/">العودة إلى الصفحة الرئيسية</a>
  </main>
</body>
</html>
